[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portrait-mask-refinement"
version = "0.1.0"
description = "A compact U-Net experiment for refining rough portrait masks into soft alpha mattes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vaibhav Jain"}]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pmr = "portrait_mask_refinement.cli:main"

[tool.setuptools.packages.find]
include = ["portrait_mask_refinement*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
